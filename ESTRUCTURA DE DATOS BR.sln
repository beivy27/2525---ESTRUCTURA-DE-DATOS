            t.AgregarJugador(new Jugador("P004", "Marco Paz", 25, "DEL", 1));
            t.AgregarJugador(new Jugador("P005", "Nina Yupa", 18, "ARQ", 0));
            t.AgregarJugador(new Jugador("P006", "Diego Díaz", 17, "DEL", 2));

            t.AsignarJugadorAEquipo("P001", "Jaguares");
