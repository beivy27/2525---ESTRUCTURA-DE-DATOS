    // === MODELOS (POO) ===
    public sealed class Jugador
    {
        public string Id { get; private set; }
        public string Nombre { get; private set; }
        public int Edad { get; private set; }
        public string Posicion { get; private set; } // ARQ/DEF/VOL/DEL
        public int Goles { get; private set; }

        public Jugador(string id, string nombre, int edad, string posicion, int goles = 0)
        {
            if (string.IsNullOrWhiteSpace(id)) throw new ArgumentException("ID inválido.");
            if (string.IsNullOrWhiteSpace(nombre)) throw new ArgumentException("Nombre inválido.");
            if (edad < 10 || edad > 60) throw new ArgumentOutOfRangeException("edad", "Edad fuera de rango.");
            if (string.IsNullOrWhiteSpace(posicion)) throw new ArgumentException("Posición inválida.");

            Id = id.Trim();
            Nombre = nombre.Trim();
            Edad = edad;
            Posicion = posicion.Trim().ToUpperInvariant();
            Goles = Math.Max(0, goles);
        }

        public void Actualizar(string nuevoNombre, int? nuevaEdad, string nuevaPosicion)
        {
            if (!string.IsNullOrWhiteSpace(nuevoNombre)) Nombre = nuevoNombre.Trim();
            if (nuevaEdad.HasValue && nuevaEdad.Value >= 10 && nuevaEdad.Value <= 60) Edad = nuevaEdad.Value;
            if (!string.IsNullOrWhiteSpace(nuevaPosicion)) Posicion = nuevaPosicion.Trim().ToUpperInvariant();
        }

        public void SumarGoles(int delta)
        {
            int nuevo = Goles + delta;
            Goles = nuevo < 0 ? 0 : nuevo;
        }

        public override string ToString()
        {
            return string.Format("{0,-8} | {1,-20} | Edad:{2,2} | Pos:{3,-3} | Goles:{4,2}",
                Id, Nombre, Edad, Posicion, Goles);
        }
    }

    public sealed class Equipo
    {
        public string Nombre { get; private set; }
        public string Categoria { get; private set; } // Libre/Sub-18/Femenino
        public HashSet<string> JugadorIds { get; private set; }

        public Equipo(string nombre, string categoria)
        {
            if (string.IsNullOrWhiteSpace(nombre)) throw new ArgumentException("Nombre de equipo inválido.");
            if (string.IsNullOrWhiteSpace(categoria)) throw new ArgumentException("Categoría inválida.");
            Nombre = nombre.Trim();
            Categoria = categoria.Trim();
            JugadorIds = new HashSet<string>(StringComparer.OrdinalIgnoreCase);
        }

        public void CambiarCategoria(string nuevaCategoria)
        {
            if (!string.IsNullOrWhiteSpace(nuevaCategoria))
                Categoria = nuevaCategoria.Trim();
        }

        public override string ToString()
        {
            return string.Format("{0,-15} | Cat:{1,-10} | Nómina:{2,2}", Nombre, Categoria, JugadorIds.Count);
        }
    }

    // === LÓGICA DE NEGOCIO (Conjuntos y Mapas) ===
    public sealed class Torneo
    {
        public Dictionary<string, Jugador> Jugadores { get; private set; }
        public Dictionary<string, Equipo> Equipos { get; private set; }

        public Torneo()
        {
            Jugadores = new Dictionary<string, Jugador>(StringComparer.OrdinalIgnoreCase);
            Equipos = new Dictionary<string, Equipo>(StringComparer.OrdinalIgnoreCase);
        }

        // --- Jugadores ---
        public bool AgregarJugador(Jugador j)
        {
            if (j == null || Jugadores.ContainsKey(j.Id)) return false;
            Jugadores[j.Id] = j;
            return true;
        }

        public Jugador ObtenerJugador(string id)
        {
            if (string.IsNullOrWhiteSpace(id)) return null;
            Jugador j;
            return Jugadores.TryGetValue(id, out j) ? j : null;
        }

        public IEnumerable<Jugador> BuscarJugadorPorNombre(string nombre)
        {
            string q = (nombre ?? "").Trim().ToLowerInvariant();
            return Jugadores.Values
                .Where(j => j.Nombre.ToLowerInvariant().Contains(q))
                .OrderBy(j => j.Nombre)
                .ThenBy(j => j.Id);
        }

        public bool ActualizarJugador(string id, string nuevoNombre, int? nuevaEdad, string nuevaPos)
        {
            var j = ObtenerJugador(id);
            if (j == null) return false;
            j.Actualizar(nuevoNombre, nuevaEdad, nuevaPos);
            return true;
        }

        public bool EliminarJugador(string id)
        {
            if (!Jugadores.ContainsKey(id)) return false;
            foreach (var e in Equipos.Values) e.JugadorIds.Remove(id); // limpiar pertenencias
            return Jugadores.Remove(id);
        }

        public bool SumarGoles(string id, int delta)
        {
            var j = ObtenerJugador(id);
            if (j == null) return false;
            j.SumarGoles(delta);
            return true;
        }

        // --- Equipos ---
        public bool AgregarEquipo(Equipo e)
        {
            if (e == null || Equipos.ContainsKey(e.Nombre)) return false;
            Equipos[e.Nombre] = e;
            return true;
        }

        public Equipo ObtenerEquipo(string nombre)
        {
            if (string.IsNullOrWhiteSpace(nombre)) return null;
            Equipo e;
            return Equipos.TryGetValue(nombre, out e) ? e : null;
        }

        public bool EliminarEquipo(string nombre)
        {
            return Equipos.Remove(nombre);
        }

        public IEnumerable<Equipo> EquiposPorCategoria(string categoria)
        {
            string c = (categoria ?? "").Trim();
            return Equipos.Values
                          .Where(e => e.Categoria.Equals(c, StringComparison.OrdinalIgnoreCase))
                          .OrderBy(e => e.Nombre);
        }

        // --- Relaciones (Conjuntos) ---
        public bool AsignarJugadorAEquipo(string idJugador, string nombreEquipo)
        {
            var j = ObtenerJugador(idJugador);
            var e = ObtenerEquipo(nombreEquipo);
            if (j == null || e == null) return false;
            int before = e.JugadorIds.Count;
            e.JugadorIds.Add(j.Id); // HashSet garantiza unicidad
            return e.JugadorIds.Count > before;
        }

        // --- Reportería ---
        public IEnumerable<Jugador> JugadoresOrdenados()
        {
            return Jugadores.Values.OrderBy(j => j.Nombre).ThenBy(j => j.Id);
        }

        public IEnumerable<Equipo> EquiposOrdenados()
        {
            return Equipos.Values.OrderBy(e => e.Nombre);
        }

        public IEnumerable<Jugador> NominaDe(string nombreEquipo)
        {
            var e = ObtenerEquipo(nombreEquipo);
            if (e == null) return new List<Jugador>();
            var lista = new List<Jugador>();
            foreach (var id in e.JugadorIds)
            {
                var j = ObtenerJugador(id);
                if (j != null) lista.Add(j);
            }
            return lista.OrderBy(x => x.Nombre);
        }

        public IEnumerable<Jugador> Goleadores(int topN)
        {
            if (topN < 1) topN = 1;
            return Jugadores.Values
                            .OrderByDescending(j => j.Goles)
                            .ThenBy(j => j.Nombre)
                            .Take(topN);
        }

        public Dictionary<string, int> TamanoNominas()
        {
            var dict = new Dictionary<string, int>(StringComparer.OrdinalIgnoreCase);
            foreach (var kv in Equipos.OrderBy(k => k.Key))
                dict[kv.Key] = kv.Value.JugadorIds.Count;
            return dict;
        }
    }

    // === Reporte y Benchmark ===
    public static class Reporte
    {
        public const string AGENTE_IA = "ChatGPT (GPT-5 Thinking)";
        public const int PORCENTAJE_IA = 20;

        public static void GuardarReporteTxt(Torneo t, string ruta = "reporte_torneo.txt")
        {
            var sb = new StringBuilder();
            sb.AppendLine("===== REPORTE DEL TORNEO (Conjuntos y Mapas) =====");
            sb.AppendLine("Fecha: " + DateTime.Now.ToString("yyyy-MM-dd HH:mm:ss"));
            sb.AppendLine("Agente de IA: " + AGENTE_IA + " | Uso declarado: " + PORCENTAJE_IA + "%");
            sb.AppendLine();

            sb.AppendLine("== Equipos ==");
            foreach (var e in t.EquiposOrdenados()) sb.AppendLine(e.ToString());
            sb.AppendLine();

            sb.AppendLine("== Jugadores ==");
            foreach (var j in t.JugadoresOrdenados()) sb.AppendLine(j.ToString());
            sb.AppendLine();

            sb.AppendLine("== Nóminas por equipo ==");
            foreach (var e in t.EquiposOrdenados())
            {
                sb.AppendLine("[ " + e.Nombre + " ]");
                var nom = t.NominaDe(e.Nombre).ToList();
                if (nom.Count == 0) sb.AppendLine("  (sin jugadores)");
                foreach (var j in nom) sb.AppendLine("  - " + j.ToString());
                sb.AppendLine();
            }

            sb.AppendLine("== Goleadores (Top 10) ==");
            int i = 1;
            foreach (var j in t.Goleadores(10))
                sb.AppendLine(string.Format("{0,2}. {1,-20} | Goles:{2,2} | ID:{3}", i++, j.Nombre, j.Goles, j.Id));

            File.WriteAllText(ruta, sb.ToString(), new UTF8Encoding(false));
            Console.WriteLine("✔ Reporte TXT guardado: " + Path.GetFullPath(ruta));
        }
    }

    public static class Benchmark
    {
        public static void Ejecutar(string csv = "tiempos_benchmark.csv")
        {
            int[] tamaños = new int[] { 1000, 5000, 10000 };
            using (var sw = new StreamWriter(csv, false, new UTF8Encoding(false)))
            {
                sw.WriteLine("n_registros,insert_ms,assign_ms,search_ms,delete_ms,search_hits,deleted");

                foreach (int n in tamaños)
                {
                    var rnd = new Random(123);
                    var t = new Torneo();

                    // Datos
                    var ids = new List<string>(n);
                    var nombres = new List<string>(n);
                    for (int i = 0; i < n; i++)
                    {
                        ids.Add("P" + (i + 1).ToString().PadLeft(6, '0'));
                        nombres.Add("Jugador " + (i + 1).ToString());
                    }
                    string[] posiciones = new string[] { "ARQ", "DEF", "VOL", "DEL" };

                    // Insertar jugadores
                    var w = Stopwatch.StartNew();
                    for (int i = 0; i < n; i++)
                    {
                        var j = new Jugador(ids[i], nombres[i], 18 + (i % 15), posiciones[i % posiciones.Length]);
                        t.AgregarJugador(j);
                    }
                    w.Stop();
                    double insertMs = w.Elapsed.TotalMilliseconds;

                    // Equipo para asignación
                    t.AgregarEquipo(new Equipo("BenchTeam", "Libre"));

                    // Asignar mitad
                    w.Restart();
                    for (int i = 0; i < n; i += 2)
                        t.AsignarJugadorAEquipo(ids[i], "BenchTeam");
                    w.Stop();
                    double assignMs = w.Elapsed.TotalMilliseconds;

                    // Búsquedas
                    int k = Math.Min(1000, n);
                    var sample = ids.OrderBy(x => rnd.Next()).Take(k).ToList();
                    int hits = 0;
                    w.Restart();
                    foreach (var pid in sample)
                        if (t.ObtenerJugador(pid) != null) hits++;
                    w.Stop();
                    double searchMs = w.Elapsed.TotalMilliseconds;

                    // Eliminaciones
                    var del = ids.OrderBy(x => rnd.Next()).Take(k).ToList();
                    int deleted = 0;
                    w.Restart();
                    foreach (var pid in del)
                        if (t.EliminarJugador(pid)) deleted++;
                    w.Stop();
                    double deleteMs = w.Elapsed.TotalMilliseconds;

                    sw.WriteLine(string.Format(
                        CultureInfo.InvariantCulture,
                        "{0},{1:F2},{2:F2},{3:F2},{4:F2},{5},{6}",
                        n, insertMs, assignMs, searchMs, deleteMs, hits, deleted));
                }
            }
            Console.WriteLine("✔ Benchmark CSV guardado: " + Path.GetFullPath(csv));
        }
    }

    // === Utilidades de consola ===
    public static class Ui
    {
        public static string LeerNoVacio(string etiqueta)
        {
            while (true)
            {
                Console.Write(etiqueta + ": ");
                string s = (Console.ReadLine() ?? "").Trim();
                if (!string.IsNullOrWhiteSpace(s)) return s;
                Console.WriteLine("Ingrese un valor no vacío.");
            }
        }

        public static int LeerEntero(string etiqueta, int min, int max)
        {
            while (true)
            {
                Console.Write(etiqueta + ": ");
                string s = Console.ReadLine();
                int v;
                if (int.TryParse(s, out v) && v >= min && v <= max) return v;
                Console.WriteLine("Ingrese un entero válido en rango [" + min + ".." + max + "].");
            }
        }

        public static bool Confirmado(string prompt = "¿Confirmar? (s/n): ")
        {
            Console.Write(prompt);
            string r = (Console.ReadLine() ?? "").Trim().ToLowerInvariant();
            return r == "s" || r == "si" || r == "sí" || r == "y";
        }

        public static string Titulo(string s)
        {
            s = (s ?? "").Trim();
            TextInfo ti = CultureInfo.CurrentCulture.TextInfo;
            return ti.ToTitleCase(s.ToLower());
        }
    }

    // === Programa principal / Menú ===
    public static class Program
    {
        public static void Main()
        {
            Console.OutputEncoding = Encoding.UTF8;

            var torneo = new Torneo();
            CargarDatosDemo(torneo);

            while (true)
            {
                Console.WriteLine("\n=== TORNEO DE FÚTBOL — MENÚ ===");
                Console.WriteLine("1) Agregar jugador");
                Console.WriteLine("2) Agregar equipo");
                Console.WriteLine("3) Asignar jugador a equipo");
                Console.WriteLine("4) Editar jugador (nombre/edad/posición)");
                Console.WriteLine("5) Registrar goles (±)");
                Console.WriteLine("6) Visualizar jugadores");
                Console.WriteLine("7) Visualizar equipos");
                Console.WriteLine("8) Visualizar nómina por equipo");
                Console.WriteLine("9) Buscar jugador por nombre");
                Console.WriteLine("10) Buscar jugador por ID");
                Console.WriteLine("11) Tabla de goleadores (Top N)");
                Console.WriteLine("12) Equipos por categoría");
                Console.WriteLine("13) Guardar reporte TXT");
                Console.WriteLine("14) Ejecutar benchmark (CSV)");
                Console.WriteLine("0) Salir");
                Console.Write("Seleccione opción: ");

                string op = (Console.ReadLine() ?? "").Trim();
                Console.WriteLine();

                try
                {
                    if (op == "1") AgregarJugadorUI(torneo);
                    else if (op == "2") AgregarEquipoUI(torneo);
                    else if (op == "3") AsignarJugadorUI(torneo);
                    else if (op == "4") EditarJugadorUI(torneo);
                    else if (op == "5") RegistrarGolesUI(torneo);
                    else if (op == "6") VisualizarJugadoresUI(torneo);
                    else if (op == "7") VisualizarEquiposUI(torneo);
                    else if (op == "8") VisualizarNominaUI(torneo);
                    else if (op == "9") BuscarJugadorNombreUI(torneo);
                    else if (op == "10") BuscarJugadorIdUI(torneo);
                    else if (op == "11") GoleadoresUI(torneo);
                    else if (op == "12") EquiposPorCategoriaUI(torneo);
                    else if (op == "13") Reporte.GuardarReporteTxt(torneo);
                    else if (op == "14") Benchmark.Ejecutar();
                    else if (op == "0") return;
                    else Console.WriteLine("Opción no válida.");
                }
                catch (Exception ex)
                {
                    Console.WriteLine("⚠ Error: " + ex.Message);
                }
            }
        }

