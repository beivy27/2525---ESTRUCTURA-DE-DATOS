            foreach (var e in t.EquiposOrdenados()) Console.WriteLine(e);
            Console.WriteLine("Total equipos: " + t.Equipos.Count);
            Console.WriteLine("— Tamaño de nóminas —");
            foreach (var kv in t.TamanoNominas()) Console.WriteLine(string.Format("{0,-15} => {1,2} jugador(es)", kv.Key, kv.Value));
        }

        private static void VisualizarNominaUI(Torneo t)
        {
            string eq = Ui.LeerNoVacio("Nombre del equipo");
            var nom = t.NominaDe(eq).ToList();
            if (nom.Count == 0) { Console.WriteLine("Sin jugadores o equipo inexistente."); return; }
            Console.WriteLine("=== NÓMINA: " + Ui.Titulo(eq) + " ===");
            foreach (var j in nom) Console.WriteLine(j);
            Console.WriteLine("Total: " + nom.Count);
        }

        private static void BuscarJugadorNombreUI(Torneo t)
        {
            string q = Ui.LeerNoVacio("Nombre (o parte)");
            var res = t.BuscarJugadorPorNombre(q).ToList();
            if (res.Count == 0) { Console.WriteLine("Sin coincidencias."); return; }
            Console.WriteLine("=== COINCIDENCIAS ===");
            foreach (var j in res) Console.WriteLine(j);
            Console.WriteLine("Total: " + res.Count);
        }

        private static void BuscarJugadorIdUI(Torneo t)
        {
            string id = Ui.LeerNoVacio("ID del jugador");
            var j = t.ObtenerJugador(id);
            Console.WriteLine(j == null ? "No encontrado." : j.ToString());
        }

        private static void GoleadoresUI(Torneo t)
        {
            int top = Ui.LeerEntero("¿Cuántos goleadores mostrar? (Top N)", 1, 1000);
            Console.WriteLine("=== GOLEADORES (Top " + top + ") ===");
            int i = 1;
            foreach (var j in t.Goleadores(top))
                Console.WriteLine(string.Format("{0,2}. {1,-20} | Goles:{2,2} | ID:{3}", i++, j.Nombre, j.Goles, j.Id));
        }

        private static void EquiposPorCategoriaUI(Torneo t)
        {
            string cat = Ui.LeerNoVacio("Categoría a consultar");
            var res = t.EquiposPorCategoria(cat).ToList();
            if (res.Count == 0) { Console.WriteLine("Sin equipos en esa categoría."); return; }
            Console.WriteLine("=== EQUIPOS — CATEGORÍA: " + Ui.Titulo(cat) + " ===");
            foreach (var e in res) Console.WriteLine(e);
            Console.WriteLine("Total: " + res.Count);
        }
