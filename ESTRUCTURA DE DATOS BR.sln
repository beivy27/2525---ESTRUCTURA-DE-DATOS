            bool ok = t.AgregarJugador(new Jugador(id, nombre, edad, pos));
            Console.WriteLine(ok ? "✔ Jugador agregado." : "✖ No se pudo agregar (ID duplicado o datos inválidos).");
        }

        private static void AgregarEquipoUI(Torneo t)
        {
            string nombre = Ui.Titulo(Ui.LeerNoVacio("Nombre del equipo"));
            string cat = Ui.Titulo(Ui.LeerNoVacio("Categoría (Libre/Sub-18/Femenino/...)"));
            bool ok = t.AgregarEquipo(new Equipo(nombre, cat));
            Console.WriteLine(ok ? "✔ Equipo agregado." : "✖ No se pudo agregar (nombre duplicado o datos inválidos).");
        }

