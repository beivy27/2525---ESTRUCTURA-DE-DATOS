            foreach (var j in t.JugadoresOrdenados()) Console.WriteLine(j);
            Console.WriteLine("Total: " + t.Jugadores.Count);
            Console.WriteLine("— Resumen de nóminas —");
            foreach (var kv in t.TamanoNominas()) Console.WriteLine(string.Format("{0,-15} => {1,2} jugador(es)", kv.Key, kv.Value));
        }

        private static void VisualizarEquiposUI(Torneo t)
        {
